name: Publish to PowerShell Gallery

on:
  push:
    branches:
      - main
    paths:
      - 'Source/**'
      - 'PoshLLM.psd1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  publish:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup PowerShell
      shell: pwsh
      run: |
        Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
        
    - name: Run Tests
      shell: pwsh
      run: |
        Write-Host "Running tests..." -ForegroundColor Green
        & ".\test.ps1"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Tests failed. Build aborted."
          exit 1
        }
        
    - name: Build Module
      shell: pwsh
      run: |
        Write-Host "Building module..." -ForegroundColor Green
        & ".\build.ps1" -SkipTests
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed."
          exit 1
        }
        
    - name: Publish to PowerShell Gallery
      shell: pwsh
      env:
        PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
      run: |
        Write-Host "Publishing module to PowerShell Gallery..." -ForegroundColor Green
        & ".\publish.ps1" -ApiKey $env:PSGALLERY_API_KEY -BuildPath ".\build"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Publish failed."
          exit 1
        }
        
    - name: Create Release Summary
      shell: pwsh
      run: |
        $manifest = Test-ModuleManifest -Path ".\PoshLLM.psd1"
        $version = $manifest.Version
        
        Write-Host "## Publication Summary" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- **Module**: PoshLLM" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- **Version**: $version" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- **Published to**: PowerShell Gallery" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- **Gallery URL**: https://www.powershellgallery.com/packages/PoshLLM/$version" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "### Installation" >> $env:GITHUB_STEP_SUMMARY
        Write-Host '```powershell' >> $env:GITHUB_STEP_SUMMARY
        Write-Host "Install-Module -Name PoshLLM -RequiredVersion $version" >> $env:GITHUB_STEP_SUMMARY
        Write-Host '```' >> $env:GITHUB_STEP_SUMMARY
